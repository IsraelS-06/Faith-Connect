<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Faith Connect UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F2EFF9] min-h-screen flex items-center justify-center text-gray-800 font-sans">

  <!-- Container Wrapper -->
  <div class="flex w-full max-w-[80%] min-h-[90vh] my-[0] mx-auto border border-gray-300 rounded-2xl overflow-hidden shadow-lg">

    <!-- Sidebar -->
   <aside id="sidebar" class="w-[70px] bg-white shadow-md flex flex-col items-center relative transition-all duration-300">
            <!-- Hamburger Menu -->
            <div id="hamburger" class="bg-[#F4B840] w-[70px] h-[50px] flex items-center justify-center rounded-tl-md cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </div>
            
            <!-- Nav Icons -->
            <nav class="flex flex-col gap-6 flex-1 justify-center">
                <a href="#" class="text-black hover:text-[#F4B840]">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 9.5L12 4l9 5.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
                    </svg>
                </a>
                <a href="#" class="text-black hover:text-[#F4B840]">
                   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M16.85 18.58a9 9 0 1 0-9.7 0"/><path d="M8 14a5 5 0 1 1 8 0"/><circle cx="12" cy="11" r="1"/><path d="M13 17a1 1 0 1 0-2 0l.5 4.5a.5.5 0 1 0 1 0Z"/></svg>
                </a>
                <a href="#" class="text-black hover:text-[#F4B840]">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><rect width="8" height="18" x="3" y="3" rx="1"/><path d="M7 3v18"/><path d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"/></svg>
                </a>
                <a href="#" class="text-black hover:text-[#F4B840]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                </a>
            </nav>
            
            <!-- Bottom Info Icon -->
            <div class="pb-5">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            </div>
        </aside>

    <!-- Main content -->
    <main id="mainContent" class="flex-1 p-6 transition-all duration-300">
      <!-- Top Bar -->
      <div class="flex justify-between items-center mb-8">
        <!-- Logo -->
       <div class="w-24 sm:w-32">
        <img src="/images/Faith connect logo.png" alt="Faith Connect Logo" class="w-full h-auto" />
      </div>
        <!-- Search bar -->
        <div class="relative w-[400px]">
          <input id="searchInput" type="text" placeholder="Search" class="w-full py-2 px-4 pl-10 rounded-lg shadow-sm border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#F4B840]" />
          <div class="absolute top-1/2 left-3 transform -translate-y-1/2 text-gray-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
        </div>

        <!-- Profile Icon -->
        <div class="text-gray-600">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        </div>
      </div>
    </main>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const searchInput = document.getElementById('searchInput');

    // Toggle Sidebar
    hamburger.addEventListener('click', () => {
      sidebar.classList.toggle('w-[70px]');
      sidebar.classList.toggle('w-[200px]');
      mainContent.classList.toggle('ml-[70px]');
      mainContent.classList.toggle('ml-[200px]');
    });

    // Search typing log
    searchInput.addEventListener('input', (e) => {
      console.log('Searching:', e.target.value);
    });
  </script>
</body>
</html>
