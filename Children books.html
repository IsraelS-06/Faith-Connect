<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children Books</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-0 p-0 box-border font-sans bg-[#EEEEEE]">
  <section class="px-[5%] pt-10">
    <h2 class="text-4xl md:text-7xl text-center md:text-left">Children Books</h2>

    <!-- Book 1 -->
    <div class="flex flex-col md:flex-row justify-center gap-[20px] items-center md:items-start mt-10">
      <div>
        <img src="images/children.png" class="w-[200px] md:w-[325px] h-auto md:h-[488px]" alt="Story of Home">
      </div>
      <div class="text-center md:text-left">
        <p class="text-xl md:text-3xl mt-4 md:mt-0">The Story of Home</p>
        <p class="text-xl md:text-3xl">by <span class="font-bold">Caroline Sounders</span></p>
      </div>
    </div>

    <!-- Book 2 -->
    <div class="flex flex-col md:flex-row justify-center gap-[20px] items-center md:items-start mt-10">
      <div>
        <img src="images/promise.png" class="w-[200px] md:w-[325px] h-auto md:h-[488px]" alt="The Promise Of God">
      </div>
      <div class="text-center md:text-left">
        <p class="text-xl md:text-3xl mt-4 md:mt-0">The Promise of God</p>
        <p class="text-xl md:text-3xl">by <span class="font-bold">Jennifer Lyell</span></p>
      </div>
    </div>
  </section>
</body>


</html>
