<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faith Connect - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="font-sans m-0 p-0 box-border">

    <!-- Signup Section -->
    <section
      class="font-sans min-h-screen flex items-center justify-center p-3"
    >
      <div
        class="bg-white rounded-3xl shadow-2xl flex overflow-hidden w-full min-h-[600px] flex-col md:flex-col lg:flex-row max-w-[100%] md:max-w-[600px] lg:max-w-[1000px]"
      >
        <!-- Signup Section -->
        <div
          class="flex-1 flex flex-col justify-center px-[20px] py-[30px] sm:px-[25px] sm:py-[35px] md:px-[40px] md:py-[50px] lg:px-[50px] lg:py-[60px]"
        >
          <div
            class="flex items-center gap-3 mb-6 sm:mb-8 md:mb-10 justify-center"
          >
            <img
              class="w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 lg:w-40 lg:h-40 object-contain"
              src="/images/Faith connect logo.png"
              alt="Faith Connect Logo"
            />
          </div>

          <h1
            class="text-2xl sm:text-3xl font-bold text-black mb-6 sm:mb-8 tracking-tight text-center"
          >
            Create an account
          </h1>

          <form>
            <div class="mb-4 sm:mb-5">
              <label
                class="block mb-1 sm:mb-2 font-bold text-black text-sm sm:text-base"
                for="full-name"
              >
                Full Name
              </label>
              <input
                id="full-name"
                type="text"
                class="w-full px-[16px] sm:px-[18px] md:px-[20px] py-[14px] sm:py-[15px] md:py-[16px] bg-[#f5f5f5] rounded-3xl text-sm sm:text-base text-[#333] focus:outline-none focus:ring-2 focus:ring-[#d4af37] transition-all duration-200"
                required
              />
            </div>

            <div class="mb-4 sm:mb-5">
              <label
                class="block mb-1 sm:mb-2 font-bold text-black text-sm sm:text-base"
                for="email"
              >
                Email
              </label>
              <input
                id="email"
                type="email"
                class="w-full px-[16px] sm:px-[18px] md:px-[20px] py-[14px] sm:py-[15px] md:py-[16px] bg-[#f5f5f5] rounded-3xl text-sm sm:text-base text-[#333] focus:outline-none focus:ring-2 focus:ring-[#d4af37] transition-all duration-200"
                required
              />
            </div>

            <div class="mb-6 sm:mb-8">
              <label
                class="block mb-1 sm:mb-2 font-bold text-black text-sm sm:text-base"
                for="password"
              >
                Password
              </label>
              <input
                id="password"
                type="password"
                class="w-full px-[16px] sm:px-[18px] md:px-[20px] py-[14px] sm:py-[15px] md:py-[16px] bg-[#f5f5f5] rounded-3xl text-sm sm:text-base text-[#333] focus:outline-none focus:ring-2 focus:ring-[#d4af37] transition-all duration-200"
                required
              />
            </div>

            <button
              type="submit"
              class="w-full p-3 sm:p-4 bg-[#d7c970] rounded-3xl font-semibold cursor-pointer mb-6 sm:mb-8 hover:shadow-lg transition-all duration-200 text-sm sm:text-base"
            >
              Submit
            </button>

            <button
              type="button"
              class="w-full p-3 sm:p-4 bg-white font-semibold cursor-pointer hover:shadow-lg transition-all duration-200 border border-gray-200 rounded-3xl mb-4"
            >
              <img
                src="/images/Google.png"
                alt="Google Icon"
                class="object-contain w-[150px] h-[40px] sm:w-[180px] sm:h-[45px] md:w-[200px] md:h-[50px] inline-block mr-2"
              />
            </button>

            <p class="text-center text-sm sm:text-base">
              Have an account?
              <a
                href="/Log-in.html"
                class="underline text-[#d4af37] hover:text-yellow-600 transition-colors duration-200"
                >Log in</a
              >
            </p>
          </form>
        </div>

        <!-- Image Panel Section - Hidden on mobile, visible on larger screens -->
        <div
          class="relative hidden sm:flex items-center justify-center p-6 sm:p-8 md:p-10 md:min-h-[200px]"
        >
          <div
            class="flex gap-3 sm:gap-4 lg:gap-5 h-full max-h-[600px] scale-[0.6] sm:scale-[0.7] md:scale-[0.8] lg:scale-100"
          >
            <div class="w-20 sm:w-24 md:w-28 lg:w-32 bg-cover bg-center">
              <img
                src="/images/panel1.png"
                alt="image-panels"
                class="w-full h-auto"
              />
            </div>
            <div class="w-20 sm:w-24 md:w-28 lg:w-32 bg-cover bg-center">
              <img
                src="/images/panel2.png"
                alt="image-panels"
                class="w-full h-auto"
              />
            </div>
            <div class="w-20 sm:w-24 md:w-28 lg:w-32 bg-cover bg-center">
              <img
                src="/images/panel3.png"
                alt="image-panels"
                class="w-full h-auto"
              />
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
