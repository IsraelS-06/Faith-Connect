<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fictional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-0 p-0 box-border font-sans bg-[#EEEEEE]">
    <section class="px-4 sm:px-8 md:px-16 pt-6 sm:pt-8 md:pt-10">
      <nav class="mb-4">
        <a href="/Books.html" class="inline-block">
          <img src="images/arrowLeft.png" class="w-8 h-8 md:w-10 md:h-10" alt="Back to Books" />
        </a>
      </nav>
      <div class="flex flex-col items-center justify-center">
        <!-- Responsive heading -->
        <h2 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl">
          Fictional Books
        </h2>
            
            <!-- Book 1: The Days of Elijah -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 sm:gap-[20px] items-center sm:items-start mt-6 sm:mt-8 md:mt-10 px-4 sm:px-0">
                <div class="flex-shrink-0">
                    <img
                        src="images/elijah.png"
                        class="w-[200px] h-[300px] sm:w-[250px] sm:h-[375px] md:w-[275px] md:h-[413px] lg:w-[325px] lg:h-[488px]"
                        alt="The Days of Elijah"
                    />
                </div>
                <div class="text-center sm:text-left">
                    <p class="text-xl sm:text-2xl md:text-3xl">The Days of Elijah</p>
                    <p class="text-xl sm:text-2xl md:text-3xl">by <span class="font-bold">Nobel,John</span></p>
                </div>
            </div>
            
            <!-- Book 2: Love comes softly -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 sm:gap-[20px] items-center sm:items-start mt-6 sm:mt-8 md:mt-10 px-4 sm:px-0">
                <div class="flex-shrink-0">
                    <img
                        src="images/softly.png"
                        class="w-[200px] h-[300px] sm:w-[250px] sm:h-[375px] md:w-[275px] md:h-[413px] lg:w-[325px] lg:h-[488px]"
                        alt="Love comes softly"
                    />
                </div>
                <div class="text-center sm:text-left">
                    <p class="text-xl sm:text-2xl md:text-3xl">Love comes softly</p>
                    <p class="text-xl sm:text-2xl md:text-3xl">
                        by <span class="font-bold">Janette Oke</span>
                    </p>
                </div>
            </div>
            
            <!-- Book 3: The Days of Joseph -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 sm:gap-[20px] items-center sm:items-start mt-6 sm:mt-8 md:mt-10 px-4 sm:px-0">
                <div class="flex-shrink-0">
                    <img
                        src="images/joseph.png"
                        class="w-[200px] h-[300px] sm:w-[250px] sm:h-[375px] md:w-[275px] md:h-[413px] lg:w-[325px] lg:h-[488px]"
                        alt="The Days of joseph"
                    />
                </div>
                <div class="text-center sm:text-left">
                    <p class="text-xl sm:text-2xl md:text-3xl">The Days of Joseph</p>
                    <p class="text-xl sm:text-2xl md:text-3xl">by <span class="font-bold">Nobel,John</span></p>
                </div>
            </div>
            
            <!-- Book 4: The Lost Brother -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 sm:gap-[20px] items-center sm:items-start mt-6 sm:mt-8 md:mt-10 px-4 sm:px-0 sm:mr-0 md:mr-5 lg:mr-10">
                <div class="flex-shrink-0">
                    <img
                        src="images/brother.png"
                        class="w-[200px] h-[300px] sm:w-[250px] sm:h-[375px] md:w-[275px] md:h-[413px] lg:w-[325px] lg:h-[488px]"
                        alt="The Lost Brother"
                    />
                </div>
                <div class="text-center sm:text-left">
                    <p class="text-xl sm:text-2xl md:text-3xl">The Lost Brother</p>
                    <p class="text-xl sm:text-2xl md:text-3xl">by <span class="font-bold">Nobel,John</span></p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
