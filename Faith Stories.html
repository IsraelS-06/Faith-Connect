<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faith building Stories</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
<body class="bg-[#EEEEEE]">
    <section class="font-sans px-4 sm:px-8 md:px-16 pt-6 sm:pt-8 md:pt-10">
        <nav class="mb-4">
          <a href="/Books.html" class="inline-block">
            <img src="images/arrowLeft.png" class="w-8 h-8 md:w-10 md:h-10" alt="Back to Books" />
          </a>
        </nav>
        <!-- Responsive heading -->
        <h2 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl">
            Faith building stories
        </h2>
        
        <!-- First book - responsive layout -->
        <div class="flex flex-col sm:flex-row justify-center gap-4 sm:gap-[20px] items-center sm:items-start mt-6 sm:mt-8 md:mt-10 px-4 sm:px-0">
            <div class="flex-shrink-0">
                <img
                    src="images/volume.png"
                    class="w-[200px] h-[300px] sm:w-[250px] sm:h-[375px] md:w-[275px] md:h-[413px] lg:w-[325px] lg:h-[488px]"
                    alt="100 Prayer Points"
                />
            </div>
            <div class="text-center sm:text-left">
                <p class="text-xl sm:text-2xl md:text-3xl">100 Prayer Points,Volume 4</p>
                <p class="text-xl sm:text-2xl md:text-3xl">by <span class="font-bold">E.A Adeboye</span></p>
            </div>
        </div>
        
        <!-- Second book - responsive layout -->
        <div class="flex flex-col sm:flex-row justify-center gap-4 sm:gap-[20px] items-center sm:items-start mt-6 sm:mt-8 md:mt-10 px-4 sm:px-0 sm:mr-0 md:mr-12 lg:mr-47">
            <div class="flex-shrink-0">
                <img
                    src="images/soar.png"
                    class="w-[200px] h-[300px] sm:w-[250px] sm:h-[375px] md:w-[275px] md:h-[413px] lg:w-[325px] lg:h-[488px]"
                    alt="Soar by T.D Jakes"
                />
            </div>
            <div class="text-center sm:text-left">
                <p class="text-xl sm:text-2xl md:text-3xl">Soar</p>
                <p class="text-xl sm:text-2xl md:text-3xl">by <span class="font-bold">T.D Jakes</span></p>
            </div>
        </div>
    </section>
</body>
</html>
