<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Non Fictional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
<body class="m-0 p-0 box-border font-sans bg-[#EEEEEE]">
  <section>
    <h2 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl px-4 sm:px-8 md:px-16 lg:px-70 pt-10 text-center md:text-left">Non Fictional</h2>

    <div class="flex flex-col md:flex-row justify-center gap-[20px] items-center md:items-start mt-10 px-4">
      <div>
        <img
          src="images/purpose.png"
          class="w-[325px] h-[488px] object-cover mx-auto md:mx-0"
          alt="Purpose Driven Life"
        />
      </div>
      <div class="text-center md:text-left">
        <p class="text-2xl md:text-3xl">The Purpose Driven Life</p>
        <p class="text-2xl md:text-3xl">by <span class="font-bold">Rick Warren</span></p>
      </div>
    </div>

    <div class="flex flex-col md:flex-row justify-center gap-[20px] items-center md:items-start mt-10 px-4">
      <div>
        <img
          src="images/pursuit.png"
          class="w-[325px] h-[488px] object-cover mx-auto md:mx-0"
          alt="The Pursuit Of God"
        />
      </div>
      <div class="text-center md:text-left">
        <p class="text-2xl md:text-3xl">The Pursuit of God</p>
        <p class="text-2xl md:text-3xl">by <span class="font-bold">A.W. Tozer</span></p>
      </div>
    </div>

    <div class="flex flex-col md:flex-row justify-center gap-[20px] items-center md:items-start mt-10 px-4">
      <div>
        <img
          src="images/Welcome.png"
          class="w-[325px] h-[488px] object-cover mx-auto md:mx-0"
          alt="Welcome Holy Spirit"
        />
      </div>
      <div class="text-center md:text-left">
        <p class="text-2xl md:text-3xl">Welcome Holy Spirit</p>
        <p class="text-2xl md:text-3xl">by <span class="font-bold">Benny Hinn</span></p>
      </div>
    </div>
  </section>
</body>


</html>
